    <path d="M32 0 L58 15 L58 49 L32 64 L6 49 L6 15 Z" fill="#0B132B" stroke="url(#evonixGrad1)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Stylized Futuristic 'E' Nodes -->
    <!-- Top Bar -->
    <path d="M19 18 L46 18 C47.5 18 48.5 19.5 47.8 21 L44.8 26 C44.3 26.8 43.5 27.2 42.5 27.2 L28 27.2 L28 30.5 L40 30.5 C41.2 30.5 42 31.8 41.5 33 L39.5 36.5 C39 37.2 38.3 37.7 37.5 37.7 L28 37.7 L28 41.2 L44.2 41.2 C45.5 41.2 46.5 42.5 45.8 43.8 L43.2 48.5 C42.7 49.4 41.8 50 40.8 50 L19 50 C16.8 50 15 48.2 15 46 L15 22 C15 19.8 16.8 18 19 18 Z" fill="url(#evonixGrad1)" />
    
    <!-- Accent Tech Dot -->
    <circle cx="50" cy="34" r="3.2" fill="#10B981" filter="url(#evonixGlow)" />
    <path d="M44 34 L47 34" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography: evonix -->
  <text x="88" y="44" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">
