  </text>
  
  <!-- Right Badge: Hissab -->
  <g transform="translate(240, 22)">
    <rect width="90" height="24" rx="6" fill="#134E4A" stroke="#10B981" stroke-width="1.2" />
    <text x="45" y="16.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#34D399" text-anchor="middle" letter-spacing="0.5">
