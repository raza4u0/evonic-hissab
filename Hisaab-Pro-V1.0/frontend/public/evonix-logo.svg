  <!-- Subtitle: TECHNOLOGIES -->
  <text x="89" y="60" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-weight="700" font-size="9" fill="#06B6D4" letter-spacing="4">
